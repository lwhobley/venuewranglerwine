build:
  name: Venue Wrangler Wine Flutter iOS
  steps:
    - eas/checkout
    - run:
        name: Install Flutter SDK
        command: |
          set -euo pipefail
          sdk="$(mktemp -d)/flutter"
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$sdk"
          set-env FLUTTER_ROOT "$sdk"
          set-env PATH "$sdk/bin:$PATH"
          "$sdk/bin/flutter" precache --ios
    - run:
        name: Prepare Flutter iOS project
        command: |
          set -euo pipefail
          python3 tool/prepare_eas_flutter.py
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build ios --release --config-only --no-codesign --dart-define-from-file .eas/flutter-defines.json
    - run:
        name: Install native iOS dependencies
        working_directory: ios
        command: pod install
    - eas/configure_ios_credentials
    - eas/generate_gymfile_from_template:
        inputs:
          credentials: ${ eas.job.secrets.buildCredentials }
          scheme: Runner
          build_configuration: Release
    - eas/run_fastlane
    - eas/find_and_upload_build_artifacts
